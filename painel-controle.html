<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Controle — Vida na Vida</title>
<style>
  :root{
    --navy-deep:#16304C; --navy:#1F3F60; --navy-soft:#EAF0F5;
    --gold:#BE9A54; --gold-soft:#F3E9D3; --cream:#FAF6EF; --paper:#FFFFFF;
    --ink:#2B2A26; --ink-soft:#5B5A54; --green:#3E8560; --red:#B5573F;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--ink); font-family:Georgia,"Iowan Old Style",serif;}
  .wrap{max-width:720px; margin:0 auto; padding-bottom:40px;}

  header{background:linear-gradient(180deg,var(--navy-deep) 0%,var(--navy) 100%); color:#F4EFE3;
    padding:28px 22px 22px; text-align:center;}
  header .kicker{letter-spacing:2px; text-transform:uppercase; font-size:11px; color:var(--gold-soft); margin:0 0 6px;}
  header h1{font-size:22px; margin:0 0 4px;}
  header p{font-size:12.5px; color:#DCE6EF; margin:0;}

  /* PIN GATE */
  .gate{max-width:340px; margin:60px auto; background:var(--paper); border:1px solid #ECE4D3; border-radius:14px;
    padding:28px 24px; text-align:center;}
  .gate h2{color:var(--navy-deep); font-size:17px; margin:0 0 14px;}
  .gate input{width:100%; padding:12px; border-radius:10px; border:1.5px solid #D3C7A8; font-family:Georgia,serif;
    font-size:16px; text-align:center; letter-spacing:4px; margin-bottom:12px; background:var(--cream);}
  .gate button{width:100%; background:var(--gold); color:#1B1607; border:none; border-radius:24px; padding:13px;
    font-size:14px; font-weight:700; font-family:Georgia,serif; cursor:pointer;}
  .gate .err{color:var(--red); font-size:12px; margin-top:10px; display:none;}

  /* DASHBOARD */
  .dash{padding:20px;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:10px;}
  .toolbar .status{font-size:11.5px; color:var(--ink-soft);}
  .btn-refresh{background:var(--navy-deep); color:#F4EFE3; border:none; border-radius:20px; padding:9px 16px;
    font-size:12px; font-family:Georgia,serif; cursor:pointer;}

  .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px;}
  .kpi{background:var(--paper); border:1px solid #ECE4D3; border-radius:12px; padding:14px 10px; text-align:center;}
  .kpi .num{font-size:24px; font-weight:700; color:var(--navy-deep);}
  .kpi .label{font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.3px; margin-top:2px;}

  .section-title{color:var(--navy-deep); font-size:16px; margin:26px 0 12px; padding-bottom:6px; border-bottom:2px solid var(--gold-soft);}

  .enc-card{background:var(--paper); border:1px solid #ECE4D3; border-radius:12px; margin-bottom:14px; overflow:hidden;}
  .enc-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; cursor:pointer; background:var(--navy-soft);}
  .enc-head .tit{font-size:13.5px; color:var(--navy-deep); font-weight:700;}
  .enc-head .stats{font-size:11px; color:var(--ink-soft);}
  .enc-body{display:none; padding:4px 16px 14px;}
  .enc-body.open{display:block;}
  .enc-progress{height:6px; background:#EDE4D0; border-radius:4px; overflow:hidden; margin:10px 0;}
  .enc-progress-fill{height:100%; background:var(--gold);}
  table.results{width:100%; border-collapse:collapse; font-size:12px; margin-top:8px;}
  table.results th{background:var(--cream); color:var(--ink-soft); text-transform:uppercase; font-size:9.5px;
    padding:6px 6px; text-align:left; letter-spacing:.3px;}
  table.results td{padding:7px 6px; border-bottom:1px solid #F0EAD9;}
  table.results td.nota-100{color:var(--green); font-weight:700;}
  table.results td.nota-baixa{color:var(--red); font-weight:700;}

  .aluno-list{background:var(--paper); border:1px solid #ECE4D3; border-radius:12px; padding:6px 0; margin-bottom:16px;}
  .aluno-row{display:flex; justify-content:space-between; padding:10px 16px; font-size:12.5px; border-bottom:1px solid #F0EAD9;}
  .aluno-row:last-child{border-bottom:none;}
  .aluno-row .nome{color:var(--ink);}
  .aluno-row .quando{color:var(--ink-soft); font-size:11px;}

  .empty-state{text-align:center; color:var(--ink-soft); font-size:13px; padding:40px 20px;}
  .config-note{background:var(--gold-soft); border:1px solid #E7D5AC; border-radius:10px; padding:14px 16px;
    font-size:12px; color:#7A5A20; margin:0 20px 20px; line-height:1.6;}
</style>
</head>
<body>

<header>
  <p class="kicker">Escola Vida na Vida</p>
  <h1>Painel de Controle</h1>
  <p>Acompanhamento de acesso e desempenho dos alunos</p>
</header>

<div class="wrap">

  <div class="gate" id="gate">
    <h2>🔒 Acesso restrito</h2>
    <input type="password" id="pinInput" placeholder="PIN" maxlength="8" inputmode="numeric">
    <button id="btnEnter">Entrar</button>
    <p class="err" id="pinErr">PIN incorreto. Tente novamente.</p>
  </div>

  <div class="dash" id="dash" style="display:none;">
    <div class="toolbar">
      <span class="status" id="statusText">Carregando dados...</span>
      <button class="btn-refresh" id="btnRefresh">🔄 Atualizar</button>
    </div>

    <div id="content"></div>
  </div>

</div>

<script>
// ======================================================================
// CONFIGURAÇÃO — cole aqui a URL publicada em CSV da sua planilha
// (Planilha → Arquivo → Compartilhar → Publicar na Web → aba "Log" → CSV)
// ======================================================================
const SHEET_CSV_URL = ''; // <-- COLE AQUI O LINK CSV DA PLANILHA
const PIN = '2026'; // troque para o PIN que preferir

const ENCONTRO_TEMAS = {
  1:'Sanguíneo e Colérico', 2:'Melancólico e Fleumático', 3:'Dons — Fundamento e Propósito',
  4:'Dons — Classificação', 5:'Descobrindo seu Dom', 6:'Responsabilidade e Zelo', 7:'Servindo com Amor'
};

document.getElementById('btnEnter').addEventListener('click', tryEnter);
document.getElementById('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryEnter(); });

function tryEnter(){
  const val = document.getElementById('pinInput').value;
  if(val === PIN){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    loadData();
  } else {
    document.getElementById('pinErr').style.display = 'block';
  }
}

document.getElementById('btnRefresh').addEventListener('click', loadData);

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h=>h.trim().toLowerCase());
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const cols = line.split(',');
    const row = {};
    headers.forEach((h,i)=> row[h] = (cols[i]||'').trim());
    return row;
  });
}

async function loadData(){
  const statusEl = document.getElementById('statusText');
  const contentEl = document.getElementById('content');
  if(!SHEET_CSV_URL){
    contentEl.innerHTML = `
      <div class="empty-state">
        📋 Ainda não conectado à planilha.<br><br>
        Cole o link CSV da sua planilha na constante <b>SHEET_CSV_URL</b>, no topo do código deste arquivo.
      </div>`;
    statusEl.textContent = 'Não configurado';
    return;
  }
  statusEl.textContent = 'Carregando...';
  try{
    const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 'cachebust=' + Date.now());
    const text = await res.text();
    const rows = parseCSV(text);
    render(rows);
    statusEl.textContent = 'Atualizado agora · ' + rows.length + ' registros';
  }catch(err){
    contentEl.innerHTML = `<div class="empty-state">⚠️ Não foi possível carregar a planilha. Verifique se o link CSV está correto e publicado.</div>`;
    statusEl.textContent = 'Erro ao carregar';
  }
}

function render(rows){
  const logins = rows.filter(r => r.event === 'login');
  const avaliacoes = rows.filter(r => r.event === 'avaliacao');
  const leituras = rows.filter(r => r.event === 'leitura');
  const quizTemp = rows.filter(r => r.event === 'quiz_temperamento');
  const quizDons = rows.filter(r => r.event === 'quiz_dons');

  const alunosUnicos = [...new Set(logins.map(r => r.aluno))];
  const alunosComAvaliacao = new Set(avaliacoes.map(r => r.aluno));

  let html = '';

  // KPIs
  html += `
    <div class="kpis">
      <div class="kpi"><div class="num">${alunosUnicos.length}</div><div class="label">Alunos ativos</div></div>
      <div class="kpi"><div class="num">${avaliacoes.length}</div><div class="label">Avaliações feitas</div></div>
      <div class="kpi"><div class="num">${quizTemp.length + quizDons.length}</div><div class="label">Quizzes especiais</div></div>
    </div>
  `;

  // Últimos acessos
  const ultimosLogins = [...logins].reverse().slice(0, 15);
  html += `<div class="section-title">👤 Últimos acessos</div>`;
  if(ultimosLogins.length === 0){
    html += `<div class="empty-state">Nenhum acesso registrado ainda.</div>`;
  } else {
    html += `<div class="aluno-list">` + ultimosLogins.map(r => `
      <div class="aluno-row"><span class="nome">${r.aluno}</span><span class="quando">${formatDate(r.ts)}</span></div>
    `).join('') + `</div>`;
  }

  // Por encontro
  html += `<div class="section-title">📚 Desempenho por Encontro</div>`;
  for(let n = 1; n <= 7; n++){
    const doEnc = avaliacoes.filter(r => String(r.encontro) === String(n));
    const total = doEnc.length;
    const media = total ? Math.round(doEnc.reduce((s,r)=> s + Number(r.nota||0), 0) / total) : 0;
    const cem = doEnc.filter(r => Number(r.nota) === 100).length;

    const rowsHtml = doEnc.slice().reverse().map(r => {
      const notaClass = Number(r.nota) === 100 ? 'nota-100' : (Number(r.nota) < 70 ? 'nota-baixa' : '');
      return `<tr><td>${r.aluno}</td><td>${r.acertos}/${r.total}</td><td class="${notaClass}">${r.nota}%</td><td>${formatDate(r.ts)}</td></tr>`;
    }).join('');

    html += `
      <div class="enc-card">
        <div class="enc-head" onclick="this.nextElementSibling.classList.toggle('open')">
          <span class="tit">Encontro ${n} — ${ENCONTRO_TEMAS[n]}</span>
          <span class="stats">${total} aval. · média ${media}%</span>
        </div>
        <div class="enc-body">
          <div class="enc-progress"><div class="enc-progress-fill" style="width:${total ? (cem/total*100) : 0}%"></div></div>
          <div style="font-size:11px; color:var(--ink-soft);">${cem} de ${total} alunos tiraram 100%</div>
          ${total ? `<table class="results"><thead><tr><th>Aluno</th><th>Acertos</th><th>Nota</th><th>Quando</th></tr></thead><tbody>${rowsHtml}</tbody></table>` : `<p style="font-size:12px; color:var(--ink-soft); margin-top:10px;">Nenhum aluno fez esta avaliação ainda.</p>`}
        </div>
      </div>
    `;
  }

  // Quizzes especiais
  html += `<div class="section-title">🎯 Quizzes Especiais</div>`;
  html += `<div class="aluno-list">`;
  if(quizTemp.length + quizDons.length === 0){
    html += `<div class="empty-state">Nenhum quiz especial feito ainda.</div>`;
  } else {
    [...quizTemp, ...quizDons].sort((a,b)=> (a.ts < b.ts ? 1 : -1)).forEach(r=>{
      const tipo = r.event === 'quiz_temperamento' ? 'Temperamento' : 'Dom';
      html += `<div class="aluno-row"><span class="nome">${r.aluno} — ${tipo}: ${r.predominante}</span><span class="quando">${formatDate(r.ts)}</span></div>`;
    });
  }
  html += `</div>`;

  document.getElementById('content').innerHTML = html;
}

function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
</script>
</body>
</html>
